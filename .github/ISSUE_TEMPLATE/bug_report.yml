name: Bug report
description: Something renders or behaves wrongly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: widgets version
      placeholder: "1.0.0rc1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, terminal and Python
      placeholder: "Windows 11, Windows Terminal, Python 3.13.2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened, and what did you expect?"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
  - type: textarea
    id: env
    attributes:
      label: Terminal environment
      description: "Values of the TERM, COLORTERM and NO_COLOR environment variables"
