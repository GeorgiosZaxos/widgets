repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: layers
        name: layer check
        entry: python tools/check_layers.py
        language: system
        pass_filenames: false
